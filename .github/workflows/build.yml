name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
      - name: Tests
        run: make test
      - name: Package
        run: make zip
      - uses: actions/upload-artifact@v7
        with:
          name: revs-aarch64-apple-darwin
          path: build/revs-aarch64-apple-darwin.zip

  # Zed's extension registry builds the extension on Linux; so does this check.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2
      - name: Build
        run: cargo build --release --target wasm32-wasip2
