name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal
      - name: Tests
        run: make test
      - name: Package
        run: make zip
      - name: Tests on the server as it ships
        run: make test-shipped
      - name: Checksums
        run: |
          make -s sums > build/server.sha256
          { echo '```'; cat build/server.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          diff -q build/server.sha256 server.sha256 || echo "::warning::server.sha256 doesn't list this build's files yet (make checksums)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: revs-aarch64-apple-darwin
          path: build/revs-aarch64-apple-darwin.zip
          retention-days: 7

  # Zed's extension registry builds the extension on Linux; so does this check.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip2
      - name: Tests
        run: cargo test --locked --lib
      - name: Build
        run: cargo build --release --locked --target wasm32-wasip2
