[package]
name = "revs-zed"
version = "1.0.2"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
# Checks the downloaded server against the checksums in server.sha256.
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true

# The language server in server/ is a separate native build.
[workspace]
