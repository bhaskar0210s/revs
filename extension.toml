id = "revs-lsp"
name = "Revs: Git Blame, Line History & Revision Diffs"
description = "Git line history like GitLens: open the previous or next revision of the current line in a side-by-side diff, with optional git blame. Apple silicon Macs only."
version = "1.0.1"
schema_version = 1
authors = ["Revs contributors"]
repository = "https://github.com/bhaskar0210s/revs"

