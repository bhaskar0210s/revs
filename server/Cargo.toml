[package]
name = "revs"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Line blame and revision diffs for Zed (language server side)"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
# Zed draws its diffs with imara-diff 0.2.0; Revs lines rows up the same way.
imara-diff = "=0.2.0"

[profile.release]
opt-level = "z"   # same speed here (git does the heavy work), a quarter smaller
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Standalone: the extension crate at the repository root is a separate build.
[workspace]
